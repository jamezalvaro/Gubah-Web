version: '3.8'

services:
  pgsql:
    image: postgres:15-alpine
    container_name: gubah_postgres
    restart: always
    environment:
      POSTGRES_DB: gubah_db
      POSTGRES_USER: Admin_Gubah237
      POSTGRES_PASSWORD: Gubah237
    ports:
      - "5434:5432"
    volumes:
      - gubah_pg_data:/var/lib/postgresql/data

volumes:
  gubah_pg_data: